<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Job details</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="wrap"><a href="/">← All jobs</a><section class="card detail"><span class="pill" th:text="${job.jobType}"></span><h1 th:text="${job.title}"></h1><h3 th:text="${job.company}"></h3><p th:text="${job.location+' · '+job.experience}"></p><p class="salary" th:text="${job.salary}"></p><h3>Description</h3><p th:text="${job.description}"></p><h3>Skills</h3><p th:text="${job.skills}"></p><a class="btn" href="/login">Login to apply</a></section></main></body></html>
