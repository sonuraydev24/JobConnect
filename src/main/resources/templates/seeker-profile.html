
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | JobConnect</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="formwrap">
    <section class="form">

        <span class="pill">JOB SEEKER PROFILE</span>

        <h1>Manage Your Profile</h1>
        <p>Keep your details updated to improve your job opportunities.</p>

        <p class="success" th:if="${success}" th:text="${success}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <!-- PROFILE UPDATE FORM -->

        <form th:action="@{/seeker/profile}" method="post">

            <label>Full Name</label>
            <input type="text"
                   name="fullName"
                   th:value="${user.fullName}"
                   required>

            <label>Email Address</label>
            <input type="email"
                   th:value="${user.email}"
                   readonly>

            <label>Mobile Number</label>
            <input type="tel"
                   name="phone"
                   th:value="${user.phone}"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   placeholder="Enter 10-digit mobile number">

            <label>Gender</label>

            <select name="gender">
                <option value="">Select Gender</option>

                <option value="Male"
                    th:selected="${user.gender == 'Male'}">
                    Male
                </option>

                <option value="Female"
                    th:selected="${user.gender == 'Female'}">
                    Female
                </option>

                <option value="Other"
                    th:selected="${user.gender == 'Other'}">
                    Other
                </option>

                <option value="Prefer not to say"
                    th:selected="${user.gender == 'Prefer not to say'}">
                    Prefer not to say
                </option>
            </select>

            <label>Highest Qualification</label>

            <input type="text"
                   name="qualification"
                   th:value="${user.qualification}"
                   placeholder="Example: BCA, MCA, B.Sc">

            <label>Skills</label>

            <textarea name="skills"
                      rows="4"
                      placeholder="Java, Spring Boot, SQL, HTML..."
                      th:text="${user.skills}"></textarea>

            <button type="submit" class="btn">
                Save Profile
            </button>

        </form>

        <hr>

        <!-- RESUME UPLOAD SECTION -->

        <h2>Upload Your Resume</h2>

        <p>Upload your latest resume in PDF format.</p>
        <p>Maximum file size: 5 MB.</p>

        <p th:if="${user.resumeName != null}">
            Current Resume:
            <strong th:text="${user.resumeName}"></strong>
        </p>

        <form th:action="@{/seeker/resume/upload}"
              method="post"
              enctype="multipart/form-data">

            <label>Select Resume (PDF)</label>

            <input type="file"
                   name="resume"
                   accept=".pdf,application/pdf"
                   required>

            <button type="submit" class="btn">
                Upload Resume
            </button>

        </form>

        <p>
            <a href="/seeker/dashboard">
                Back to Dashboard
            </a>
        </p>

    </section>
</main>

</body>
</html>
