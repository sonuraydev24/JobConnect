<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login | JobConnect</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="formwrap"><section class="form"><span class="pill">WELCOME BACK</span><h1>Sign in</h1><p class="error" th:if="${param.error}">Invalid email or password.</p><p class="ok" th:if="${param.registered}">Account created. Please sign in.</p><form method="post" th:action="@{/login}"><label>Email</label><input name="username" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn">Sign in</button></form><p>New user? <a href="/register">Create account</a></p></section></main></body></html>
