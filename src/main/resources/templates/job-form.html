<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Post a job</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="formwrap"><section class="form wide"><h1>Post a new job</h1><form method="post" th:action="@{/recruiter/jobs}"><label>Job title</label><input name="title" required><label>Company</label><input name="company" required><label>Location</label><input name="location" required><label>Job type</label><select name="jobType"><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Contract</option></select><label>Experience</label><input name="experience" placeholder="Fresher / 0-2 years" required><label>Salary</label><input name="salary" placeholder="₹3-5 LPA"><label>Skills</label><input name="skills" placeholder="Java, Spring Boot, SQL"><label>Description</label><textarea name="description" rows="6" required></textarea><button class="btn">Publish job</button></form></section></main></body></html>
